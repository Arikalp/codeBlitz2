<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favArch" x1="4" y1="26" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C25E20" />
      <stop offset="60%" stop-color="#D97736" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="32" height="32" rx="7" fill="#FAF8F5" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#EFE6DC" />

  <!-- Bridge Base Nodes -->
  <circle cx="6" cy="24" r="2" fill="#D97736" />
  <circle cx="26" cy="24" r="2" fill="#2E7D32" />

  <!-- Bridge Arch -->
  <path
    d="M 6 24 C 6 13, 13 8, 16 8 C 19 8, 26 13, 26 24"
    stroke="url(#favArch)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Bridge Deck -->
  <path
    d="M 6 22.5 C 11 23.5, 21 23.5, 26 22.5"
    stroke="#D97736"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Center Keystone -->
  <circle cx="16" cy="15" r="3.5" fill="#FFFDF9" stroke="#D97736" stroke-width="1.5" />
  <!-- Heartbeat / pulse apex -->
  <path
    d="M 14.2 15 L 15.3 15 L 15.8 13.5 L 16.4 16.5 L 17 15 L 17.8 15"
    stroke="#D97736"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
